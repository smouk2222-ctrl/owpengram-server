name: Build Server for Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build ARM64 Binary
        run: |
          GOOS=linux GOARCH=arm64 go build -o server ./cmd/telesrv

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: owpengram-server-android
          path: server
